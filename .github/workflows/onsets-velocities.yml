name: Onsets and Velocities integration
on:
  push:
    branches: [main]
    paths: ['Server/**', 'PianoBloom/Onsets*', '.github/workflows/onsets-velocities.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: andres-fr/iamusica_training
          ref: 629ff11aceadf01ecc456b1c7f26a104f7e1e571
          path: upstream-model
      - name: Install CPU-only model dependencies
        run: |
          python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r Server/onsets_velocities/requirements.txt
      - name: Fetch short public piano fixture
        run: |
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/bytedance/piano_transcription/1ade7dcd4348add669a67c6e6282456c8c6633bd/resources/cut_liszt.mp3 -o piano-fixture.mp3
          echo '0a551787adbc61776e3b0691b7727a2276f2a8bf47fa4aad0fb4e8f89ef83603  piano-fixture.mp3' | sha256sum --check
      - name: Exercise official model through the live audio protocol
        run: python Server/onsets_velocities/test_service.py --source upstream-model --audio piano-fixture.mp3
