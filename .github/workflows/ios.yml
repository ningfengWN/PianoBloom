name: iOS build and core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test real pitch and practice logic
        run: bash scripts/test-core.sh
      - name: Build iPhone and iPad simulator app
        run: >-
          xcodebuild -project PianoBloom.xcodeproj -scheme PianoBloom
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iOS device app
        run: >-
          xcodebuild -project PianoBloom.xcodeproj -scheme PianoBloom
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Capture iPad practice flow
        timeout-minutes: 8
        run: python3 scripts/capture-previews.py --family iPad
      - name: Save simulator app and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PianoBloom-simulator
          path: |
            build/Build/Products/Debug-iphonesimulator/PianoBloom.app
            build/previews/
      - name: Save layout previews separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PianoBloom-previews
          path: build/previews/
